[package]
name = "photograph"
version = "0.1.2"
edition = "2024"
default-run = "photograph"
license = "GPL-2.0-only"

[dependencies]
eframe = "0.35"
egui = "0.35"
exif = { version = "0.6", package = "kamadak-exif" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
anyhow = "1"
dirs = "6"
imageproc = "0.27"
rawler = "0.7.1"
toml = "1.1"
rayon = "1.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wgpu = "24.0.5"
pollster = "1.0"

[profile.release]
opt-level = 3
