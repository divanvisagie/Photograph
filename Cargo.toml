[package]
name = "photograph"
version = "0.1.3"
edition = "2024"
default-run = "photograph"
license = "GPL-2.0-only"

[features]
default = ["network-mounts"]
# Scans /proc/mounts and XDG_RUNTIME_DIR/gvfs for active network shares and
# surfaces them in the browser sidebar's "NETWORK" section. Off in the Snap
# build (see docs/adr/0013-network-mounts-deb-only.md): the Snap Store rejects
# uploads plugging the privileged system-files interface that GVfs access
# needs, so the Snap build disables this feature entirely rather than ship it
# half-working. Use the .deb if you need it.
network-mounts = []

[dependencies]
eframe = "0.35"
egui = "0.35"
exif = { version = "0.6", package = "kamadak-exif" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
anyhow = "1"
dirs = "6"
imageproc = "0.27"
rawler = "0.7.1"
toml = "1.1"
rayon = "1.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wgpu = "30"
pollster = "1.0"

[profile.release]
opt-level = 3
