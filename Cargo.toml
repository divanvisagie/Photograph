[package]
name = "photograph"
version = "0.5.2"
edition = "2024"
default-run = "photograph"
license = "GPL-2.0-only"
description = "Native desktop photo browser and non-destructive editor for RAW images and color grading"
repository = "https://github.com/divanvisagie/Photograph"
homepage = "https://github.com/divanvisagie/Photograph"
readme = "README.md"
keywords = ["photo", "raw", "editor", "image", "photography"]
categories = ["multimedia::images", "graphics"]
exclude = ["docs/", "target/", "Makefile", ".claude/", ".github/", "scripts/", "packaging/macos/"]

[features]
default = []

[dependencies]
eframe = "0.35"
egui = "0.35"
patina-ui = "0.1.19"
zbus = "5"
exif = { version = "0.6", package = "kamadak-exif" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
anyhow = "1"
dirs = "6"
imageproc = "0.27"
rawler = "0.7.1"
toml = "1.1"
rayon = "1.10"
bytemuck = { version = "1.25", features = ["extern_crate_alloc"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wgpu = "30"
pollster = "1.0"

# GVfs, for browsing and mounting network shares (ADR-0029).
[target.'cfg(target_os = "linux")'.dependencies]
gio = "0.22"
async-channel = "2"

# Open With on macOS arrives as a delegate message, not as a command-line argument.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray"] }

[profile.release]
opt-level = 3
